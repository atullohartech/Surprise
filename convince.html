<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Say Yes ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3a5);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

.container{
    width:90%;
    max-width:700px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    text-align:center;
    color:white;
    box-shadow:0 0 25px rgba(255,255,255,.3);
    animation:fadeIn 1.2s ease;
    z-index:5;
}

h1{
    font-size:42px;
    margin-bottom:20px;
    animation:glow 2s infinite alternate;
}

p{
    font-size:21px;
    line-height:1.8;
    margin-bottom:35px;
}

.button-box{
    position:relative;
    width:100%;
    height:170px;
}

#yesBtn{

    position:absolute;
    left:20%;
    bottom:20px;

    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#00c853;
    color:white;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 0 20px #00c853;
    transition:.3s;

}

#yesBtn:hover{

    transform:scale(1.08);
    box-shadow:0 0 35px white;

}

#noBtn{

    position:absolute;
    right:20%;
    bottom:20px;

    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#ff1744;
    color:white;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 0 20px #ff1744;

    transition:left .25s ease,
               top .25s ease;

}

/* Floating Hearts */

.heart{
    position:absolute;
    bottom:-30px;
    color:#ff1744;
    animation:floatHeart linear forwards;
}

@keyframes floatHeart{

0%{
transform:translateY(0) scale(.5);
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

@keyframes glow{

from{
text-shadow:0 0 10px white;
}

to{
text-shadow:0 0 30px white,
            0 0 60px pink;
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:768px){

h1{
font-size:30px;
}

p{
font-size:18px;
}

#yesBtn,#noBtn{

font-size:18px;
padding:12px 25px;

}

.button-box{
height:200px;
}

}

</style>

</head>
<body>

<div class="container">

<h1>🥺 Please Don't Say No...</h1>

<p>

I spent my time creating this little surprise only to see your beautiful smile. ❤️

It won't take long, and I promise it'll be worth it.

Will you please click <b>YES</b>? 🥹💕

</p>

<div class="button-box" id="buttonBox">

<button id="yesBtn"
onclick="location.href='surprise.html'">

💖 Yes, I'm Ready

</button>

<button id="noBtn">

🙈 No

</button>

</div>

</div>

<script>

// Moving No Button

const noBtn=document.getElementById("noBtn");
const box=document.getElementById("buttonBox");

function moveButton(){

const boxRect=box.getBoundingClientRect();

const maxX=box.clientWidth-noBtn.offsetWidth;
const maxY=box.clientHeight-noBtn.offsetHeight;

const x=Math.random()*maxX;
const y=Math.random()*maxY;

noBtn.style.left=x+"px";
noBtn.style.top=y+"px";

noBtn.style.right="auto";
noBtn.style.bottom="auto";

}

// Desktop
noBtn.addEventListener("mouseenter",moveButton);

// Mobile
noBtn.addEventListener("touchstart",function(e){

e.preventDefault();
moveButton();

});

// Click
noBtn.addEventListener("click",function(e){

e.preventDefault();
moveButton();

});

// Floating Hearts

function heart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*20)+"px";

h.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},8000);

}

setInterval(heart,250);

</script>
<audio id="bgMusic" loop>
    <source src="music/until-i-found-you.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<script>
const music = document.getElementById("bgMusic");

// Start music after first user interaction
document.addEventListener("click", function () {
    music.play();
}, { once: true });
</script>
</body>
</html>
