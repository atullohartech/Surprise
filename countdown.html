<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Final Countdown ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3a5);
overflow:hidden;
position:relative;
}

.container{

width:90%;
max-width:700px;
padding:40px;
text-align:center;
background:rgba(255,255,255,.18);
backdrop-filter:blur(15px);
border-radius:25px;
color:white;
box-shadow:0 0 25px rgba(255,255,255,.3);

}

h1{

font-size:45px;
margin-bottom:20px;
animation:glow 2s infinite alternate;

}

#count{

font-size:80px;
font-weight:bold;
margin:30px 0;

}

#question{

display:none;
animation:fade 1s;

}

button{

margin:15px;
padding:15px 35px;
font-size:20px;
border:none;
border-radius:50px;
cursor:pointer;
transition:.4s;

}

.yes{

background:#00c853;
color:white;
box-shadow:0 0 20px #00c853;

}

.no{

background:#ff1744;
color:white;
box-shadow:0 0 20px #ff1744;

}

button:hover{

transform:scale(1.08);

}

.heart{

position:absolute;
bottom:-50px;
color:#ff1744;
animation:float 6s linear forwards;

}

@keyframes glow{

from{ text-shadow:0 0 10px white; }

to{ text-shadow:0 0 30px white,0 0 60px pink; }

}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes float{

0%{
transform:translateY(0) scale(.5);
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

</style>

</head>
<body>

<div class="container">

<h1>❤️ Final Surprise ❤️</h1>

<p>Get ready... Something special is waiting for you!</p>

<div id="count">5</div>

<div id="question">

<h2>🥺 Are You Ready For The Surprise?</h2>

<br>

<button class="yes" onclick="location.href='surprise.html'">
Yes ❤️
</button>

<button class="no" onclick="location.href='convince.html'">
No 🙈
</button>

</div>

</div>

<script>

let num=5;

let timer=setInterval(function(){

num--;

document.getElementById("count").innerHTML=num;

if(num==0){

clearInterval(timer);

document.getElementById("count").style.display="none";

document.getElementById("question").style.display="block";

}

},1000);

// Floating Hearts

function heart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(4+Math.random()*3)+"s";

document.body.appendChild(h);

setTimeout(function(){

h.remove();

},7000);

}

setInterval(heart,250);

</script>

</body>
</html>
