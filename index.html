<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend Day ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

:root{
    --bg1:#ff9a9e;
    --bg2:#fad0c4;
    --text:#ffffff;
    --card:rgba(255,255,255,0.18);
    --button:#ff4081;
}

body.dark{
    --bg1:#141E30;
    --bg2:#243B55;
    --text:#ffffff;
    --card:rgba(255,255,255,0.08);
    --button:#ff4d94;
}

body{
    height:100vh;
    overflow:hidden;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    display:flex;
    justify-content:center;
    align-items:center;
    transition:1s;
    position:relative;
}

/* Card */

.container{
    width:90%;
    max-width:900px;
    text-align:center;
    padding:45px;
    border-radius:25px;
    background:var(--card);
    backdrop-filter:blur(12px);
    color:var(--text);
    box-shadow:0 0 25px rgba(0,0,0,.25);
    animation:fadeIn 2s ease;
    z-index:10;
}

h1{
    font-size:55px;
    margin-bottom:15px;
    animation:glow 2s infinite alternate;
}

h2{
    font-size:35px;
    color:#fff176;
    margin-bottom:20px;
}

.typing{
    font-size:22px;
    display:inline-block;
    border-right:3px solid white;
    white-space:normal;
    word-wrap:break-word;
    overflow:hidden;
    max-width:100%;
    min-height:60px;
    animation:blink .8s infinite;
}

.open-btn{
    display:inline-block;
    margin-top:40px;
    padding:18px 45px;
    text-decoration:none;
    color:white;
    border-radius:50px;
    background:var(--button);
    font-size:22px;
    transition:.4s;
    box-shadow:0 0 15px var(--button);
    animation:pulse 2s infinite;
}

.open-btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 35px white;
}

.toggle{
    position:absolute;
    top:20px;
    right:20px;
    border:none;
    background:white;
    padding:12px 18px;
    border-radius:30px;
    cursor:pointer;
    font-size:18px;
    transition:.4s;
    z-index:20;
}

.toggle:hover{
    transform:scale(1.1);
}

/* Floating Hearts */

.heart{
    position:absolute;
    bottom:-50px;
    color:#ff1744;
    animation:floatHeart linear forwards;
}

/* Falling Roses */

.rose{
    position:absolute;
    top:-50px;
    animation:fall linear forwards;
}

/* Animations */

@keyframes floatHeart{

0%{
transform:translateY(0) scale(.5);
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

@keyframes fall{

0%{
transform:translateY(-20px) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(120vh) rotate(360deg);
opacity:0;
}

}

@keyframes pulse{

0%,100%{
transform:scale(1);
}

50%{
transform:scale(1.07);
}

}

@keyframes glow{

from{
text-shadow:0 0 10px white;
}

to{
text-shadow:0 0 35px #fff,0 0 60px pink;
}

}


@keyframes blink{

50%{
border-color:transparent;
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:600px){

h1{
font-size:38px;
}

h2{
font-size:28px;
}

.typing{
font-size:18px;
}

.open-btn{
font-size:18px;
padding:15px 30px;
}

}
</style>

</head>
<body>

<button class="toggle" onclick="toggleMode()">🌙</button>

<div class="container">

<h1>💖 Happy Girlfriend Day 💖</h1>

<h2>Dear <span style="color:#FFE082;">Pagal</span></h2>

<div class="typing" id="typing"></div>
<br>

<a href="message.html" class="open-btn">
💌 Click to Open 
</a>

</div>

<script>

// Dark Light Mode

function toggleMode(){

document.body.classList.toggle("dark");

let btn=document.querySelector(".toggle");

if(document.body.classList.contains("dark")){

btn.innerHTML="☀️";

}
else{

btn.innerHTML="🌙";

}

}

// Typing Effect

const text = "Every heartbeat of mine whispers your name. ❤️";

let i = 0;

function typeWriter() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 70);
    }
}

typeWriter();

// Floating Hearts

function heart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},8000);

}

setInterval(heart,250);

// Falling Roses

function rose(){

let r=document.createElement("div");

r.className="rose";

r.innerHTML="🌹";

r.style.left=Math.random()*100+"vw";

r.style.fontSize=(20+Math.random()*20)+"px";

r.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(r);

setTimeout(()=>{

r.remove();

},10000);

}

setInterval(rose,350);

</script>

</body>
</html>
