<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reasons I Love You ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3a5);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

/* Glass Card */

.container{
    width:90%;
    max-width:800px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    text-align:center;
    color:white;
    box-shadow:0 0 25px rgba(255,255,255,.3);
    z-index:2;
    animation:fadeIn 1.5s;
}

h1{
    font-size:45px;
    margin-bottom:15px;
    animation:glow 2s infinite alternate;
}

.subtitle{
    font-size:20px;
    margin-bottom:30px;
}

/* Reason Card */

.reason-box{

    min-height:170px;
    background:rgba(255,255,255,.15);
    border-radius:20px;
    padding:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
    line-height:1.6;
    transition:.5s;
    animation:pop .8s;
}

.show-btn{

    margin-top:30px;
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#ff006e;
    color:white;
    font-size:20px;
    cursor:pointer;
    box-shadow:0 0 20px #ff006e;
    transition:.4s;
}

.show-btn:hover{

    transform:scale(1.08);
    box-shadow:0 0 35px white;

}

.next-btn{

    display:inline-block;
    margin-top:20px;
    padding:15px 35px;
    text-decoration:none;
    color:white;
    background:#6a5acd;
    border-radius:50px;
    font-size:20px;
    box-shadow:0 0 20px #6a5acd;
    transition:.4s;

}

.next-btn:hover{

    transform:scale(1.08);
    box-shadow:0 0 35px white;

}

/* Floating Hearts */

.heart{

    position:absolute;
    bottom:-50px;
    color:#ff1744;
    animation:floatHeart linear forwards;

}

/* Animations */

@keyframes glow{

from{
text-shadow:0 0 10px white;
}

to{
text-shadow:0 0 30px white,0 0 60px pink;
}

}

@keyframes pop{

from{
transform:scale(.8);
opacity:0;
}

to{
transform:scale(1);
opacity:1;
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(30px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@keyframes floatHeart{

0%{
transform:translateY(0) scale(.5);
opacity:1;
}

100%{
transform:translateY(-120vh) scale(1.5);
opacity:0;
}

}

@media(max-width:768px){

h1{
font-size:32px;
}

.reason-box{
font-size:22px;
}

.subtitle{
font-size:17px;
}

}

</style>

</head>
<body>

<div class="container">

<h1>❤️ Reasons I Love You ❤️</h1>

<p class="subtitle">
Every click reveals another reason why you're so special to me.
</p>

<div class="reason-box" id="reason">
Click the button below to reveal the first reason. 💕
</div>

<button class="show-btn" onclick="showReason()">
💖 Reveal Next Reason
</button>

<br>

<a href="countdown.html" class="next-btn">
💍 One Last Surprise →
</a>

</div>

<script>

const reasons=[

"😊 Your beautiful smile brightens even my darkest days.",

"💖 Your kindness makes everyone around you feel loved.",

"🥰 You understand me even when I don't say a word.",

"🌸 Your caring nature makes my life beautiful.",

"😂 Your laughter is my favorite sound in the world.",

"🤗 You always support me in every situation.",

"✨ You inspire me to become a better person.",

"🌹 You make ordinary moments feel magical.",

"❤️ You love me just the way I am.",

"🌍 Because life with you is my favorite adventure.",

"💍 Because every future dream I have includes you."

];

let index=0;

function showReason(){

const box=document.getElementById("reason");

box.style.animation="none";

void box.offsetWidth;

box.style.animation="pop .7s";

box.innerHTML=reasons[index];

index++;

if(index>=reasons.length){

index=0;

}

}

// Floating Hearts

function heart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";

h.style.fontSize=(15+Math.random()*20)+"px";

h.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},8000);

}

setInterval(heart,300);

</script>

</body>
</html>
