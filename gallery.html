<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Beautiful Memories ❤️</title>


<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffd3a5);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;
}

.container{
    width:90%;
    max-width:900px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    padding:30px;
    border-radius:25px;
    text-align:center;
    color:white;
    box-shadow:0 0 25px rgba(255,255,255,.3);
    animation:fadeIn 1.5s ease;
    z-index:2;
}

h1{
    font-size:45px;
    margin-bottom:15px;
    animation:glow 2s infinite alternate;
}

.subtitle{
    font-size:20px;
    margin-bottom:25px;
}

/* Image Slider */

/* Image Slider */

.slider{
    width:100%;
    max-width:420px;
    height:600px;
    margin:0 auto;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:pink;
    display:flex;
    justify-content:center;
    align-items:center;
    box-shadow:0 0 20px rgba(255,255,255,.5);
}

.slide{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    opacity:0;
    transition:opacity 1s ease-in-out;
    padding:10px;
}

.slide.active{
    opacity:1;
}

/* Buttons */

.prev,
.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(255,255,255,.3);
    border:none;
    color:white;
    font-size:35px;
    padding:10px 18px;
    cursor:pointer;
    border-radius:50%;
    transition:.3s;
}

.prev:hover,
.next:hover{
    background:white;
    color:#ff4081;
}

.prev{
    left:15px;
}

.next{
    right:15px;
}

/* Dots */

.dots{
    margin-top:20px;
}

.dot{
    display:inline-block;
    width:14px;
    height:14px;
    border-radius:50%;
    background:white;
    opacity:.5;
    margin:5px;
    cursor:pointer;
    transition:.3s;
}

.dot.active{
    opacity:1;
    transform:scale(1.4);
    background:#ff1744;
}

/* Next Page Button */

.love-btn{
    display:inline-block;
    margin-top:30px;
    padding:15px 35px;
    text-decoration:none;
    color:white;
    background:linear-gradient(45deg,#ff006e,#ff4d94);
    border-radius:50px;
    font-size:20px;
    font-weight:bold;
    box-shadow:0 0 20px rgba(255,0,110,.8);
    transition:.4s;
    animation:pulse 2s infinite;
}

.love-btn:hover{
    transform:scale(1.08);
    box-shadow:0 0 35px white;
}

/* Floating Hearts */

.heart{
    position:absolute;
    bottom:-50px;
    color:#ff1744;
    animation:floatHeart linear forwards;
}

/* Falling Roses */

.rose{
    position:absolute;
    top:-40px;
    animation:fall linear forwards;
}

/* Animations */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes glow{
    from{
        text-shadow:0 0 10px white;
    }
    to{
        text-shadow:0 0 30px white,0 0 60px pink;
    }
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

@keyframes floatHeart{
    0%{
        transform:translateY(0) scale(.5);
        opacity:1;
    }
    100%{
        transform:translateY(-120vh) scale(1.6);
        opacity:0;
    }
}

@keyframes fall{
    0%{
        transform:translateY(-30px) rotate(0deg);
        opacity:1;
    }
    100%{
        transform:translateY(120vh) rotate(360deg);
        opacity:0;
    }
}

/* Responsive */

@media(max-width:768px){

    h1{
        font-size:32px;
    }

    .subtitle{
        font-size:17px;
    }

    .slider{
        max-width:300px;
        height:450px;
    }

    .love-btn{
        font-size:17px;
        padding:12px 25px;
    }

    .prev,
    .next{
        font-size:25px;
        padding:8px 14px;
    }

}
</style>

</head>
<body>

<div class="container">

<h1>📸 Look At You ❤️</h1>

<p class="subtitle">
Every picture tells a story, and every story reminds me how lucky I am to have you. 💕
</p>

<div class="slider">

    <img src="image/ChatGPT Image Jul 31, 2026, 8_23_59 PM.png" class="slide active">
    <img src="image/ChatGPT Image Jul 31, 2026, 08_2359 PM.png" class="slide">
    <img src="image/ChatGPT ImageJul 31, 2026, 08_23_59 PM.png" class="slide">
    <img src="image/ChatGPT Imge Jul 31, 2026, 08_23_59 PM.png" class="slide">
    <img src="image/ChatPT Image Jul 31, 2026, 08_23_59 PM.png" class="slide">

    
</div>

<div class="dots">
    <span class="dot active" onclick="currentSlide(0)"></span>
    <span class="dot" onclick="currentSlide(1)"></span>
    <span class="dot" onclick="currentSlide(2)"></span>
    <span class="dot" onclick="currentSlide(3)"></span>
    <span class="dot" onclick="currentSlide(4)"></span>
</div>

<a href="reasons.html" class="love-btn">
    ❤️ Click To Next →
</a>

</div>

<script>

let slides=document.querySelectorAll(".slide");
let dots=document.querySelectorAll(".dot");
let index=0;

function showSlide(n){

    slides.forEach(slide=>slide.classList.remove("active"));
    dots.forEach(dot=>dot.classList.remove("active"));

    if(n>=slides.length) index=0;
    else if(n<0) index=slides.length-1;
    else index=n;

    slides[index].classList.add("active");
    dots[index].classList.add("active");
}

function changeSlide(n){
    showSlide(index+n);
}

function currentSlide(n){
    showSlide(n);
}

setInterval(()=>{
    showSlide(index+1);
},3000);

// Floating Hearts

function heart(){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤";

h.style.left=Math.random()*100+"vw";
h.style.fontSize=(15+Math.random()*20)+"px";
h.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},8000);

}

setInterval(heart,300);

// Falling Roses

function rose(){

let r=document.createElement("div");

r.className="rose";

r.innerHTML="🌹";

r.style.left=Math.random()*100+"vw";
r.style.fontSize=(18+Math.random()*18)+"px";
r.style.animationDuration=(6+Math.random()*3)+"s";

document.body.appendChild(r);

setTimeout(()=>{

r.remove();

},9000);

}

setInterval(rose,450);

</script>

</body>
</html>
